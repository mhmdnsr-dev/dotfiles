[color]
night-light-enabled=false
night-light-schedule-automatic=false
night-light-schedule-from=17.0
night-light-schedule-to=5.0
night-light-temperature=uint32 3700

[media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/crow1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/crow2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/crow3/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/crow4/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/crow5/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/crow6/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/crow7/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/flameshot1/']

[media-keys/custom-keybindings/crow1]
binding='<Primary><Alt>e'
command='@HOME@/.local/bin/crow-wayland translate'
name='Crow: Translate selected text'

[media-keys/custom-keybindings/crow2]
binding='<Primary><Alt>s'
command='@HOME@/.local/bin/crow-wayland speak'
name='Crow: Speak selected text'

[media-keys/custom-keybindings/crow3]
binding='<Primary><Alt>f'
command='@HOME@/.local/bin/crow-wayland speak-translation'
name='Crow: Speak translation of selected text'

[media-keys/custom-keybindings/crow4]
binding='<Primary><Alt>g'
command='@HOME@/.local/bin/crow-wayland stop'
name='Crow: Stop text speaking'

[media-keys/custom-keybindings/crow5]
binding='<Primary><Alt>c'
command='@HOME@/.local/bin/crow-wayland show'
name='Crow: Show main window'

[media-keys/custom-keybindings/crow6]
binding='<Primary><Alt>i'
command='@HOME@/.local/bin/crow-wayland ocr-recognize'
name='Crow: Recognize text in screen area'

[media-keys/custom-keybindings/crow7]
binding='<Primary><Alt>o'
command='@HOME@/.local/bin/crow-wayland ocr-translate'
name='Crow: Translate text in screen area'

[media-keys/custom-keybindings/custom0]
binding='<Primary>i'
command='flatpak run it.mijorus.smile'
name='emoji picker'

[media-keys/custom-keybindings/custom1]
binding='<Ctrl><Alt><Shift>H'
command='dbus-send --session --dest=com.zoom.HotKeyService --type=method_call /com/zoom/HotKeyListener com.zoom.HotKeyListener.keyPressed int64:55834574920 string:"<Ctrl><Alt><Shift>H"'
name='ZMHKey55834574920'

[media-keys/custom-keybindings/flameshot1]
binding='<Primary><Shift>Print'
command='env QT_QPA_PLATFORM=xcb flameshot gui'
name='Flameshot: capture area'

[power]
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'
